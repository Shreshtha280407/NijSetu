[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nijsetu"
version = "0.1.0"
description = "NijSetu Phase 1+2 - offline CPU-only ingest/detect/link and privacy sanitization pipeline for Project RAKSHA"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "Faker==40.63.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nijsetu = ["gazetteer/data/*.json", "gazetteer/data/*.md", "gazetteer/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 145

[tool.ruff.lint]
select = ["E", "F", "W"]
