[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nijsetu"
version = "0.1.0"
description = "NijSetu Phase 1+2 - offline CPU-only ingest/detect/link and privacy sanitization pipeline for Project RAKSHA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# RapidFuzz remains a *preferred accelerator only* (see nijsetu.translit.similarity's
# tested-equivalent pure-Python fallback) and stays out of `dependencies` so a
# failed/skipped install there degrades speed, never correctness.
#
# `cryptography` is the one mandatory runtime dependency: Gate 0.6 encrypts
# NijSetu's own raw/private working files at rest (see nijsetu.security) with
# AES-256-GCM, and the stdlib has no audited AEAD primitive to do that
# without one. Pinned exactly (never a floor) so the organizer's `pip
# install .` resolves one known-good, pre-built wheel; vendor/wheels/ carries
# that wheel plus its own two dependencies (cffi, pycparser) for the same
# cp311-manylinux offline install path rapidfuzz already uses.
dependencies = [
    "cryptography==46.0.7",
]

[project.optional-dependencies]
speed = [
    "rapidfuzz==3.14.6",
]
dev = [
    "pytest==8.4.2",
    "Faker==40.63.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nijsetu = ["gazetteer/data/*.json", "gazetteer/data/*.md", "gazetteer/data/*.txt", "demo_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 145

[tool.ruff.lint]
select = ["E", "F", "W"]
