<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="770" viewBox="0 0 1600 770" role="img" aria-label="From fragmented records to a checked release">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#77728e" stroke-width="1.6"/></marker></defs>
<rect width="1600" height="770" rx="26" fill="#f5ecdf"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="60" font-size="19" fill="#8c633c" font-weight="700">NIJSETU  /  THE RELEASE JOURNEY</text><text x="64" y="118" font-size="44" fill="#30294f" font-weight="600">From fragmented records to a checked release</text><text x="64" y="161" font-size="24" fill="#686173" font-weight="400">The Python pipeline links evidence, transforms identity, and checks what it publishes.</text><rect x="64" y="218" width="330" height="215" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="89" y="252" font-size="18" fill="#8b6136" font-weight="700">01  /  UNDERSTAND</text><text x="89" y="294" font-size="28" fill="#30294f" font-weight="600">Ingest + detect</text><text x="89" y="332" font-size="23" fill="#625d72" font-weight="400">CSV / TSV / JSON / TXT</text><text x="89" y="366" font-size="22.0125786163522" fill="#625d72" font-weight="400">Supported FHIR resources</text><text x="89" y="400" font-size="21.132075471698112" fill="#625d72" font-weight="400">Content + hidden surfaces</text><rect x="446" y="218" width="330" height="215" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="471" y="252" font-size="18" fill="#8b6136" font-weight="700">02  /  CORROBORATE</text><text x="471" y="294" font-size="28" fill="#30294f" font-weight="600">Resolve patients</text><text x="471" y="332" font-size="23" fill="#625d72" font-weight="400">Scoped identifiers</text><text x="471" y="366" font-size="20.31930333817126" fill="#625d72" font-weight="400">Cross-script name evidence</text><text x="471" y="400" font-size="23" fill="#625d72" font-weight="400">Conflicts veto a merge</text><rect x="828" y="218" width="330" height="215" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="853" y="252" font-size="18" fill="#8b6136" font-weight="700">03  /  TRANSFORM</text><text x="853" y="294" font-size="28" fill="#30294f" font-weight="600">Apply policy</text><text x="853" y="332" font-size="23" fill="#625d72" font-weight="400">Release-scoped HMACs</text><text x="853" y="366" font-size="22.0125786163522" fill="#625d72" font-weight="400">Age bands + date offsets</text><text x="853" y="400" font-size="21.132075471698112" fill="#625d72" font-weight="400">Private staging directory</text><rect x="1210" y="218" width="326" height="215" rx="20" fill="#30294f" stroke="#635779" stroke-width="2"/><text x="1235" y="252" font-size="18" fill="#edbb7a" font-weight="700">04  /  CHECK</text><text x="1235" y="294" font-size="28" fill="#fff7e9" font-weight="600">Validate</text><text x="1235" y="332" font-size="23" fill="#d4cbdf" font-weight="400">Residual leak scans</text><text x="1235" y="366" font-size="23" fill="#d4cbdf" font-weight="400">Clinical invariants</text><text x="1235" y="400" font-size="22.641509433962263" fill="#d4cbdf" font-weight="400">FHIR + output structure</text><path d="M394 325 H436" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><path d="M776 325 H818" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1158 325 H1200" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="64" y="520" width="580" height="160" rx="20" fill="#f9e8cc" stroke="#ded2c5" stroke-width="2"/><text x="89" y="565" font-size="28" fill="#30294f" font-weight="600">Hold or quarantine</text><text x="89" y="606" font-size="23" fill="#625d72" font-weight="400">Malformed, unsupported or unresolved units</text><text x="89" y="640" font-size="23" fill="#625d72" font-weight="400">Reason codes make exclusions inspectable</text><rect x="828" y="520" width="708" height="160" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="853" y="565" font-size="28" fill="#30294f" font-weight="600">Publish only checked output</text><text x="853" y="606" font-size="23" fill="#625d72" font-weight="400">Internal CLI: release-wide blocking on residual leaks</text><text x="853" y="640" font-size="23" fill="#625d72" font-weight="400">Organizer: attributable leaking files are quarantined</text><path d="M230 433 V505" fill="none" stroke="#77728e" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M610 433 V482 H460 V505" fill="none" stroke="#77728e" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow)"/><path d="M1373 433 V505" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><text x="64" y="740" font-size="17" fill="#83798c" font-weight="600">OFFLINE ENGINE  ·  CPU ONLY  ·  SOURCE-AWARE VALIDATION</text></g></svg>