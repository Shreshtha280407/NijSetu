<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="60" font-size="19" fill="#8c633c" font-weight="700">NIJSETU  /  SYSTEM ARCHITECTURE</text><text x="64" y="118" font-size="44" fill="#30294f" font-weight="600">One local engine. Two output contracts.</text><text x="64" y="161" font-size="24" fill="#686173" font-weight="400">The dashboard is a separate synthetic demonstration; an API adapter remains future work.</text><rect x="64" y="220" width="345" height="180" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="89" y="254" font-size="18" fill="#8b6136" font-weight="700">IMPLEMENTED ENTRY POINT</text><text x="89" y="296" font-size="28" fill="#30294f" font-weight="600">Python CLI</text><text x="89" y="334" font-size="19.1932335718933" fill="#625d72" font-weight="400">analyze / sanitize / validate</text><text x="89" y="368" font-size="20.61495457721873" fill="#625d72" font-weight="400">Local key file + release ID</text><rect x="64" y="445" width="345" height="180" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="89" y="479" font-size="18" fill="#8b6136" font-weight="700">IMPLEMENTED ENTRY POINT</text><text x="89" y="521" font-size="28" fill="#30294f" font-weight="600">Organizer adapter</text><text x="89" y="559" font-size="23" fill="#625d72" font-weight="400">main.py + RAKSHA_SECRET</text><text x="89" y="593" font-size="17.954960438222763" fill="#625d72" font-weight="400">Contract + locator verification</text><rect x="470" y="213" width="620" height="500" rx="24" fill="#e9e1f0" stroke="#c9bad6" stroke-width="2"/><text x="500" y="257" font-size="21" fill="#6a567f" font-weight="700">NIJSETU ENGINE  /  src/nijsetu</text><rect x="500" y="280" width="560" height="112" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="525" y="325" font-size="28" fill="#30294f" font-weight="600">Ingest + PII detection</text><text x="525" y="366" font-size="19.638043896804003" fill="#625d72" font-weight="400">Adapters, gazetteer, bounded encoded-payload scan</text><rect x="500" y="421" width="560" height="112" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="525" y="466" font-size="28" fill="#30294f" font-weight="600">Identity resolution</text><text x="525" y="507" font-size="18.505079825834542" fill="#625d72" font-weight="400">Candidate evidence, scoped IDs, contradiction vetoes</text><rect x="500" y="562" width="560" height="112" rx="20" fill="#fffaf3" stroke="#ded2c5" stroke-width="2"/><text x="525" y="607" font-size="28" fill="#30294f" font-weight="600">Privacy + validation</text><text x="525" y="648" font-size="18.505079825834542" fill="#625d72" font-weight="400">Policy, HMAC tokens, staging, leak + clinical checks</text><path d="M780 392 V412" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><path d="M780 533 V553" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><path d="M409 310 H455" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><path d="M409 535 H455" fill="none" stroke="#77728e" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1150" y="220" width="386" height="205" rx="20" fill="#30294f" stroke="#635779" stroke-width="2"/><text x="1175" y="254" font-size="18" fill="#edbb7a" font-weight="700">SANITIZE CONTRACT</text><text x="1175" y="296" font-size="28" fill="#fff7e9" font-weight="600">Internal release</text><text x="1175" y="334" font-size="23" fill="#d4cbdf" font-weight="400">released/ + manifest.json</text><text x="1175" y="368" font-size="21.860767729342875" fill="#d4cbdf" font-weight="400">report.json + hold_index.json</text><text x="1175" y="402" font-size="23" fill="#d4cbdf" font-weight="400">Standalone validate command</text><rect x="1150" y="476" width="386" height="205" rx="20" fill="#30294f" stroke="#635779" stroke-width="2"/><text x="1175" y="510" font-size="18" fill="#edbb7a" font-weight="700">SECRET WARDS CONTRACT</text><text x="1175" y="552" font-size="28" fill="#fff7e9" font